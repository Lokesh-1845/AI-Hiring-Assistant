<!DOCTYPE html>

      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f6ff',
              100: '#e0edff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              accent: '#6366f1'
            }
          }
        }
      }
    }
  </script>

      background-size: 40px 40px;

        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .glow-effect {
      box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.25);
    }
  </style>
</head>

  <!-- Background Ambient Glows -->

  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Container Card -->
  <main class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl glow-effect relative z-10">
    
    <!-- Branding Section -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-blue-500 text-white mb-4 shadow-lg shadow-indigo-500/30">
        <i data-lucide="bot" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white capitalize">ai hiring bot</h1>
      <p class="text-sm text-slate-400 mt-2 leading-relaxed">
        Connect, solve, and create with your intelligent AI companion.
      </p>
    </header>

    <!-- Success Feedback Banner (Initially Hidden) -->
    <div id="successBanner" class="hidden mb-6 p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-sm flex items-center gap-3">
      <i data-lucide="check-circle-2" class="w-5 h-5 flex-shrink-0"></i>
      <span>Authentication successful! Redirecting to dashboard...</span>
    </div>

      <!-- Email Field -->
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
          Work Email
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </div>
          <input 
            type="email"
            name="email" 
            id="email"
            placeholder="name@company.com"
            required
            class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-sm text-white"
          >
        </div>
        <p id="emailError" class="hidden mt-1.5 text-xs text-rose-500 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
          <span>Please enter a valid email address.</span>
        </p>
      </div>

      <!-- Password Field -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
            Password
          </label>
          <a href="#" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium transition">
            Forgot Password?
          </a>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            class="w-full pl-10 pr-10 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition text-sm text-white placeholder-slate-500"
          >
          <button 
            type="button" 
            id="togglePassword"
            aria-label="Toggle password visibility"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition"
          >
            <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
          </button>
        </div>
        <p id="passwordError" class="hidden mt-1.5 text-xs text-rose-500 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
          <span>Password is required.</span>
        </p>
      </div>

      <!-- Remember Me Checkbox -->
      <div class="flex items-center">
        <input 
          type="checkbox" 
          id="remember" 
          class="w-4 h-4 rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900"
        >
        <label for="remember" class="ml-2 text-sm text-slate-400 select-none">
          Remember me for 30 days
        </label>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3 px-4 bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 active:scale-[0.99] text-white font-medium rounded-xl shadow-lg shadow-indigo-500/25 transition-all duration-200 flex items-center justify-center gap-2"
      >
        <span id="btnText">Sign In Ai Hiring Bot</span>
        <i data-lucide="loader-2" id="btnSpinner" class="hidden w-5 h-5 animate-spin"></i>
      </button>
    </form>

    <!-- Social Login Divider -->
    <div class="my-6 flex items-center">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="px-3 text-xs uppercase tracking-wider text-slate-500 bg-transparent">Or continue with</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <!-- Social Login Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <button 
        type="button" 
        class="flex items-center justify-center gap-2 py-2.5 px-4 bg-slate-950/60 border border-slate-800 rounded-xl hover:bg-slate-800/50 hover:border-slate-700 text-slate-300 text-sm font-medium transition"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
          <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 22.3 12 23z"/>
        </svg>
        <span>Google</span>
      </button>

      <button 
        type="button" 
        class="flex items-center justify-center gap-2 py-2.5 px-4 bg-slate-950/60 border border-slate-800 rounded-xl hover:bg-slate-800/50 hover:border-slate-700 text-slate-300 text-sm font-medium transition"
      >
        <i data-lucide="github" class="w-4 h-4"></i>
        <span>GitHub</span>
      </button>
    </div>

    <!-- Footer / Signup Link -->
    <footer class="mt-8 text-center text-sm text-slate-400">
      Don't have an account? 
      <a href="#" class="text-indigo-400 hover:text-indigo-300 font-semibold transition">Sign up</a>
    </footer>

  </main>

  <!-- Interactive JavaScript -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // DOM Elements
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const successBanner = document.getElementById('successBanner');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    // Toggle Password Visibility
    let isPasswordVisible = false;
    togglePasswordBtn.addEventListener('click', () => {
      isPasswordVisible = !isPasswordVisible;
      passwordInput.type = isPasswordVisible ? 'text' : 'password';
      eyeIcon.setAttribute('data-lucide', isPasswordVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
    });

    // Helper: Email Validation Regex
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Input blur clear error states
    emailInput.addEventListener('input', () => emailError.classList.add('hidden'));
    passwordInput.addEventListener('input', () => passwordError.classList.add('hidden'));
